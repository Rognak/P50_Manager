[project]
name = "p50-backend"
version = "0.1.0"
description = "Прогресс 50 Менеджмент — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
    "openpyxl>=3.1",
    "openai>=1.57",
    "python-docx>=1.1",
    "markdown>=3.6",
    "arq>=0.26",
    "mammoth>=1.8",
    "pypdf>=6.10.2",
    "httpx>=0.28",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
